name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # E2E (Playwright) is intentionally not enabled in CI yet: it needs the
      # Neon dev DB and a DATABASE_URL secret (GitHub secrets not configured,
      # see Task 13). The Vitest suite above runs without secrets — the 6 DB
      # integration tests skip when DATABASE_URL is absent, keeping CI green.
      # When secrets exist, add:
      #   - name: E2E
      #     run: |
      #       pnpm exec playwright install --with-deps chromium
      #       pnpm test:e2e
